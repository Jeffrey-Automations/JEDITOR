name: JE_Editor Dev

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  build_dev_version:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r dev_requirements.txt
          pip install -e .
      - name: Run unit tests
        run: python -m pytest test/ -v --tb=short --ignore=test/qt_ui
      - name: Test Start Editor
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
        run: python ./test/qt_ui/unit_test/start_qt_ui.py
        shell: cmd
      - name: Test Extend Editor
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
        run: python ./test/qt_ui/unit_test/extend_test.py
        shell: cmd

  nuitka-build:
    # 打包的執行檔：照 exe/build_nuitka.py 的方式建置，再用 exe/check_build.py 檢查它能啟動。
    # 建置很久，所以沒有工作等它；推到 dev 時保留一週，讓人在真正的機器上試。
    # The packaged executable: built as exe/build_nuitka.py builds it, then checked
    # by exe/check_build.py (the editor starts). Nothing waits for this job: a build
    # takes long. A push to dev keeps the build for a week, to be tried on a real machine.
    name: Nuitka build
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}\.nuitka-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore Nuitka's cache
        # C 編譯器的產出與下載的東西；沒有它，建置要多花好幾倍時間
        # The C compiler's output and the downloads; a build without it takes several times longer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .nuitka-cache
          key: nuitka-${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt', 'dev_requirements.txt', 'exe/build_nuitka.py') }}
          restore-keys: nuitka-${{ runner.os }}-py3.12-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r dev_requirements.txt
          pip install -e .
      - name: Build the executable
        run: python exe/build_nuitka.py
      - name: Check the executable
        run: python exe/check_build.py exe/build/start_editor.dist/JEditor.exe
      - name: Upload the compilation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nuitka-compilation-report
          path: exe/build/compilation-report.xml
          if-no-files-found: ignore
      - name: Upload the executable
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: JEditor-windows
          path: exe/build/start_editor.dist
          retention-days: 7
          if-no-files-found: error

  publish-dev:
    # The dev channel. A push to dev that passes the tests is built from dev.toml and uploaded when
    # it is still the tip of dev and ships something the newest je_editor_dev does not.
    # scripts/dev_release.py picks the version from PyPI, so nothing is committed back.
    name: Publish je_editor_dev to PyPI
    needs: [build_dev_version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15  # about 3x the slowest recent run, at least 15
    concurrency:
      group: publish-dev
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # 這個工作拿得到 PyPI token，所以工具只照雜湊鎖定的清單裝、只收 wheel，也不另外升級 pip。
      # 清單與重新產生它的指令在 .github/requirements/publish.in。
      # This job holds the PyPI token, so its tools come from a hash-locked, wheels-only list and pip
      # is not upgraded on the side. The list and the command that regenerates it are in
      # .github/requirements/publish.in.
      - name: Install build tooling
        run: |
          python -m pip install --require-hashes --only-binary :all: -r .github/requirements/publish.txt

      - name: Write pyproject.toml from dev.toml with the next version
        run: python scripts/dev_release.py prepare

      # --no-isolation：用 publish.txt 鎖定的 setuptools 建置；隔離建置會另外下載當下最新的那一版。
      # --no-isolation: build with the setuptools locked in publish.txt; an isolated build downloads
      # whatever is newest at that moment instead.
      - name: Build distribution
        run: python -m build --no-isolation

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Compare with the newest published wheel
        id: compare
        run: python scripts/dev_release.py changed dist

      # A run that finishes after a newer push would otherwise publish older code as the newest release.
      - name: Check that this commit is still the tip of dev
        id: tip
        run: |
          tip="$(git ls-remote origin refs/heads/dev | cut -f1)"
          if [ "$tip" = "$GITHUB_SHA" ]; then current=true; else current=false; fi
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI
        if: steps.compare.outputs.changed == 'true' && steps.tip.outputs.current == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*
